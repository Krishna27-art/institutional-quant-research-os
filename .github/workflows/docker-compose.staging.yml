# Docker Compose for Staging Environment
# 90-Day Plan Item #8 - Staging Environment

version: '3.8'

services:
  # Redis (Staging)
  redis-staging:
    image: redis:7-alpine
    container_name: quant-redis-staging
    ports:
      - "6380:6379"
    volumes:
      - redis-staging-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL (Staging)
  postgres-staging:
    image: postgres:15-alpine
    container_name: quant-postgres-staging
    environment:
      POSTGRES_DB: quantdb_staging
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres-staging-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse (Staging)
  clickhouse-staging:
    image: clickhouse/clickhouse-server:latest
    container_name: quant-clickhouse-staging
    ports:
      - "8124:8123"
    volumes:
      - clickhouse-staging-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: quantdb_staging
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Quant API (Staging)
  quant-api-staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant-api-staging
    ports:
      - "8001:8000"
    environment:
      - ENV=staging
      - REDIS_HOST=redis-staging
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres-staging
      - POSTGRES_PORT=5432
      - POSTGRES_DB=quantdb_staging
      - CLICKHOUSE_HOST=clickhouse-staging
      - CLICKHOUSE_PORT=8123
    depends_on:
      redis-staging:
        condition: service_healthy
      postgres-staging:
        condition: service_healthy
      clickhouse-staging:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  # Prometheus (Staging)
  prometheus-staging:
    image: prom/prometheus:latest
    container_name: quant-prometheus-staging
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-staging-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  # Grafana (Staging)
  grafana-staging:
    image: grafana/grafana:latest
    container_name: quant-grafana-staging
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-staging_admin}
    volumes:
      - grafana-staging-data:/var/lib/grafana
    depends_on:
      - prometheus-staging
    restart: unless-stopped

volumes:
  redis-staging-data:
  postgres-staging-data:
  clickhouse-staging-data:
  prometheus-staging-data:
  grafana-staging-data:
